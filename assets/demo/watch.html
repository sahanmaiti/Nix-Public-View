<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nix demos</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 32px 20px 64px;
      background: #000;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 28px; font-weight: 650; margin: 0 0 8px; }
    p { color: #b5b5b5; margin: 0 0 28px; }
    a { color: #f5f5f5; }
    h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
    section { margin-bottom: 36px; }
    video {
      width: 100%;
      background: #111;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Nix</h1>
    <p>Close the window. Quit the app. <a href="https://nix-mu.vercel.app">nix-mu.vercel.app</a></p>
    <section>
      <h2>Product demo</h2>
      <video src="nix-demo.mp4" controls playsinline preload="metadata"></video>
    </section>
    <section>
      <h2>Onboarding</h2>
      <video src="nix-onboarding.mp4" controls playsinline preload="metadata"></video>
    </section>
  </main>
</body>
</html>
